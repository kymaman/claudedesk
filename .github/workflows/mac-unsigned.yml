name: Mac unsigned build

# Manually build UNSIGNED macOS .dmg files for an existing release tag and attach
# them to that release. No Apple Developer certificate / notarization required —
# same posture as the unsigned Windows installer. Users open via right-click ->
# Open (or `xattr -dr com.apple.quarantine ClaudeDesk.app`).
#
# Two separate per-arch builds instead of a universal one: the compiled native dep
# better-sqlite3 is built for the runner's arch only, so a universal x64+arm64 merge
# ships one arch's binary in both slices and crashes on the other. So we build:
#   - arm64 on an Apple Silicon runner (Apple Silicon, M1-M4)
#   - x64   on an Intel runner (macos-13) for Intel Macs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build from and attach the .dmg files to'
        required: true
        default: 'v0.3.12-stable'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      - name: Build unsigned arm64 macOS dmg
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Disable code signing entirely. With no signing identity electron-builder
          # also skips notarization, so no Apple credentials are needed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build -- --mac --arm64 --publish never -c.mac.notarize=false

      - name: Attach arm64 .dmg to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" release/*.dmg --clobber

  build-x64:
    runs-on: macos-13 # Intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      - name: Build unsigned x64 macOS dmg
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build -- --mac --x64 --publish never -c.mac.notarize=false

      - name: Attach x64 .dmg to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" release/*.dmg --clobber
